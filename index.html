<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="./style.css">
  <title>Facilitator</title>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { db, TEAMS, MULT, $, fmt, cls, bonus, DEFAULT_STATE, calculatePayoff, listenState } from './common.js';
    import { ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    let S = null;
    const base = location.origin + location.pathname.replace('/index.html', '');

    window.act = async function(action, param) {
      const stateRef = ref(db, 'gameState');

      if (action === 'start') {
        await update(stateRef, { phase: 'choosing', round: 1 });
      } else if (action === 'reveal') {
        const { pay, countX } = calculatePayoff(S.choices, S.round);
        const newBal = { ...S.bal };
        for (const t of TEAMS) { newBal[t.id] += pay[t.id]; }
        const roundTotal = Object.values(pay).reduce((a, b) => a + b, 0);

        const historyRecord = {
          round: S.round,
          nX: countX,
          choices: S.choices,
          pay: pay
        };

        const newHistory = [...(S.history || []), historyRecord];

        await update(stateRef, {
          phase: 'revealed',
          bal: newBal,
          total: (S.total || 0) + roundTotal,
          history: newHistory
        });
      } else if (action === 'next') {
        const nextR = S.round + 1;
        await update(stateRef, {
          phase: 'choosing',
          round: nextR,
          locked: { red: false, blue: false, yellow: false, green: false },
          choices: { red: null, blue: null, yellow: null, green: null }
        });
      } else if (action === 'goto') {
        await update(stateRef, {
          phase: 'choosing',
          round: parseInt(param),
          locked: { red: false, blue: false, yellow: false, green: false },
          choices: { red: null, blue: null, yellow: null, green: null }
        });
      } else if (action === 'reset') {
        await set(stateRef, DEFAULT_STATE);
      }
    };

    function draw(s) {
      S = s;
      const lockedMap = s.locked || {};
      const lc = Object.values(lockedMap).filter(Boolean).length;
      const fin = s.phase === 'revealed' && s.round === 10;

      let ctl = s.phase === 'lobby' ? '<button class="pri" onclick="act(\'start\')">▶ Start game</button>'
        : s.phase === 'choosing' ? `<button class="pri" ${lc < 4 ? 'disabled' : ''} onclick="act('reveal')">👁 Reveal (${lc}/4 locked)</button>`
        : fin ? '<span class="chip bonus">Game finished 🎉</span>' : `<button class="pri" onclick="act('next')">Next round → ${s.round + 1}</button>`;

      const opts = [...Array(10)].map((_, i) => `<option value="${i + 1}" ${s.round === i + 1 ? 'selected' : ''}>Round ${i + 1}${MULT[i + 1] ? ' (×' + MULT[i + 1] + ')' : ''}</option>`).join('');
      const cards = TEAMS.map(t => `<div class="tc ${t.id}">${t.name}<small>${s.phase === 'lobby' ? '—' : lockedMap[t.id] ? '🔒 Locked' : 'Thinking…'}</small></div>`).join('');
      
      const historyList = s.history || [];
      const rows = historyList.map(h => `<tr><td>${h.round}${MULT[h.round] ? ' ×' + MULT[h.round] : ''}</td><td>${h.nX}X/${4 - h.nX}Y</td>${TEAMS.map(t => `<td class="${cls(h.pay[t.id])}">${h.choices[t.id]} ·${fmt(h.pay[t.id])}</td>`).join('')}</tr>`).join('');

      const links = [['📺 Projector', './projector.html', 'blue']].concat(TEAMS.map(t => [t.name + ' team', `./player.html?team=${t.id}`, t.id])).map(l => `<div class="row" style="margin:6px 0"><span class="chip ${l[2]}" style="min-width:110px;text-align:center">${l[0]}</span><input readonly value="${base + '/' + l[1]}" onfocus="this.select()"><a href="${l[1]}" target="_blank">Open</a></div>`).join('');

      $('#app').innerHTML = `<div class="panel"><h1>🎯 Win As Much As You Can — Facilitator</h1><p class="mut">Send each team its link or let them scan the URL on their phone.</p>${links}</div>
      <div class="panel"><div class="row"><h2 style="margin:0">Round ${s.round || '—'}</h2>${bonus(s.round)}<select onchange="act('goto',this.value)"><option disabled ${s.round ? '' : 'selected'}>Jump to round…</option>${opts}</select>${ctl}<button onclick="confirm('Reset the whole game?')&&act('reset')">↺ Reset</button></div>
      ${MULT[s.round] ? '<p class="mut">Bonus round: cluster-wide discussion allowed. Payoff ×' + MULT[s.round] + '.</p>' : ''}</div>
      <div class="grid4">${cards}</div>
      <div class="panel"><h3>Scores <span class="mut">(cluster total: <b class="${cls(s.total)}">${fmt(s.total || 0)}</b> pts)</span></h3><div style="overflow-x:auto"><table><tr><th>Round</th><th>Pattern</th>${TEAMS.map(t => '<th>' + t.name + '</th>').join('')}</tr>${rows || '<tr><td colspan="6" class="mut">No rounds revealed yet</td></tr>'}<tr><th colspan="2">Balance</th>${TEAMS.map(t => `<th class="${cls(s.bal?.[t.id])}">${fmt(s.bal?.[t.id] || 0)}</th>`).join('')}</tr></table></div></div>
      <div class="panel"><h3>Payoff schedule (points per team, × multiplier)</h3><table><tr><th>Pattern</th><th>X teams</th><th>Y teams</th></tr><tr><td>4 X</td><td class="neg">−1</td><td>—</td></tr><tr><td>3 X, 1 Y</td><td class="pos">+1</td><td class="neg">−3</td></tr><tr><td>2 X, 2 Y</td><td class="pos">+2</td><td class="neg">−2</td></tr><tr><td>1 X, 3 Y</td><td class="pos">+3</td><td class="neg">−1</td></tr><tr><td>4 Y</td><td>—</td><td class="pos">+1</td></tr></table>
      <p class="mut">Rules: confidential choices · consensus within each team · no cluster-wide talk except rounds 5, 8, 10.</p></div>`;
    }

    listenState(draw);
  </script>
</body>
</html>
